name: Version 3 browser diagnosis
on:
  push:
    paths:
      - '.github/workflows/version-3-browser-test.yml'
  workflow_dispatch:
jobs:
  isolate-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Isolate document parsing and inline script
        timeout-minutes: 2
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { readFile } from 'node:fs/promises';
          import { createServer } from 'node:http';
          const source = await readFile('index.html','utf8');
          const stripped = source
            .replace('<script async src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>','')
            .replace(/<link rel="stylesheet"[^>]*>/,'')
            .replace(/<script>([\s\S]*?)<\/script>/i,'<script>console.log("INLINE SCRIPT REPLACED");</script>');
          const server = createServer((req,res)=>{
            const body=req.url==='/without-app-script'?stripped:source;
            res.writeHead(200,{'content-type':'text/html; charset=utf-8','content-length':Buffer.byteLength(body)});
            res.end(body);
          });
          await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
          const origin='http://127.0.0.1:'+server.address().port;
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          for (const path of ['/without-app-script','/with-app-script']) {
            const page=await browser.newPage();
            const events=[];
            page.on('domcontentloaded',()=>events.push('DOMContentLoaded'));
            page.on('load',()=>events.push('load'));
            page.on('pageerror',e=>events.push('PAGE ERROR '+e.message));
            page.on('console',m=>{if(m.type()==='error')events.push('CONSOLE ERROR '+m.text());});
            const response=await page.goto(origin+path,{waitUntil:'commit',timeout:10000});
            await page.waitForTimeout(2500);
            let state='evaluation timed out';
            try { state=await page.evaluate(()=>({readyState:document.readyState,title:document.title,bodyLength:document.body.innerHTML.length,home:!!document.querySelector('#home.page.active')})); } catch(e) { state=e.message; }
            console.log(JSON.stringify({path,status:response?.status(),events,state}));
            await page.close();
          }
          await browser.close();
          await new Promise(resolve=>server.close(resolve));
          JS

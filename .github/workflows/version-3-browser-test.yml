name: Version 3 browser diagnosis
on:
  push:
    paths:
      - '.github/workflows/version-3-browser-test.yml'
  workflow_dispatch:
jobs:
  isolate-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Trace inline script execution
        timeout-minutes: 2
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { readFile } from 'node:fs/promises';
          import { createServer } from 'node:http';
          let html=await readFile('index.html','utf8');
          html=html.replace('<script async src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>','').replace(/<link rel="stylesheet"[^>]*>/,'');
          const match=html.match(/<script>([\s\S]*?)<\/script>/i);
          const instrumented=match[1].split('\n').map((line,i)=>line?'console.log("SCRIPT LINE  + (i+1) + ");\n'+line:line).join('\n');
          html=html.replace(match[0],'<script>'+instrumented+'</script>');
          const server=createServer((req,res)=>{res.writeHead(200,{'content-type':'text/html; charset=utf-8','content-length':Buffer.byteLength(html)});res.end(html);});
          await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();
          const seen=[];
          page.on('console',m=>{seen.push(m.text());console.log('BROWSER '+m.text());});
          page.on('pageerror',e=>{seen.push('PAGE ERROR '+e.message);console.log('BROWSER ERROR '+e.message);});
          page.on('domcontentloaded',()=>console.log('DOM CONTENT LOADED'));
          const url='http://127.0.0.1:'+server.address().port+'/';
          await Promise.race([page.goto(url,{waitUntil:'commit',timeout:8000}).catch(e=>console.log('GOTO '+e.message)),new Promise(resolve=>setTimeout(resolve,12000))]);
          console.log('TRACE SUMMARY '+JSON.stringify(seen));
          await browser.close();
          await new Promise(resolve=>server.close(resolve));
          JS

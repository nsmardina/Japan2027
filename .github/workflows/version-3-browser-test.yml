name: Version 3 browser diagnosis
on:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - '.github/workflows/version-3-browser-test.yml'
  workflow_dispatch:
jobs:
  isolate-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Test app after document is ready
        timeout-minutes: 2
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { readFile } from 'node:fs/promises';
          import { createServer } from 'node:http';
          let html=await readFile('index.html','utf8');
          html=html.replace('<script defer src="app.js"></script>','');
          const server=createServer((req,res)=>{res.writeHead(200,{'content-type':'text/html; charset=utf-8','content-length':Buffer.byteLength(html)});res.end(html);});
          await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();
          page.on('pageerror',e=>console.log('PAGE ERROR '+e.message));
          await page.goto('http://127.0.0.1:'+server.address().port+'/',{waitUntil:'domcontentloaded',timeout:10000});
          console.log('BASE DOCUMENT READY');
          await page.addScriptTag({path:'app.js'});
          console.log('APP SCRIPT EXECUTED');
          await page.evaluate(()=>document.dispatchEvent(new Event('DOMContentLoaded')));
          console.log('DOM READY HANDLER DISPATCHED');
          const result=await page.evaluate(()=>({home:!!document.querySelector('#home.page.active'),nav:document.querySelectorAll('.nav button').length,budget:document.querySelector('#budget')?.value,foods:document.querySelectorAll('#food details.food-item').length,itinerary:document.querySelectorAll('#itineraryLocations .location-accordion').length,debug:document.getElementById('app-debug')?.innerText||''}));
          console.log('RESULT '+JSON.stringify(result));
          await browser.close();
          await new Promise(resolve=>server.close(resolve));
          JS

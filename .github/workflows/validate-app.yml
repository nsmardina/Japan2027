name: Validate Japan app JavaScript
on:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'version-2-backup.html'
      - '.github/workflows/validate-app.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax in both app versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          checks = [("app.js", Path("app.js").read_text())]
          html = Path("version-2-backup.html").read_text()
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, re.I)
          scripts = [script for script in scripts if script.strip()]
          if not scripts:
              raise SystemExit("No inline application script found in version-2-backup.html")
          checks.append(("version-2-backup.html", "\\n".join(scripts)))
          for filename, source in checks:
              path = Path("/tmp/app.js")
              path.write_text(source)
              result = subprocess.run(["node", "--check", str(path)], capture_output=True, text=True)
              if result.returncode:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit(f"JavaScript syntax failed in {filename}")
              print(f"JavaScript syntax passed: {filename}")
          PY

name: Validate Japan app JavaScript
on:
  push:
    paths:
      - 'index.html'
      - 'version-2-backup.html'
      - '.github/workflows/validate-app.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax in both app versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          for filename in ("index.html", "version-2-backup.html"):
              html = Path(filename).read_text()
              scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, re.I)
              scripts = [script for script in scripts if script.strip()]
              if not scripts:
                  raise SystemExit(f"No inline application script found in {filename}")
              Path("/tmp/app.js").write_text("\n".join(scripts))
              result = subprocess.run(["node", "--check", "/tmp/app.js"], capture_output=True, text=True)
              if result.returncode:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit(f"JavaScript syntax failed in {filename}")
              print(f"JavaScript syntax passed: {filename} ({len(scripts)} inline script(s))")
          PY

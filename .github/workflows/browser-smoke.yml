name: Japan app browser smoke test
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run app and capture startup errors
        timeout-minutes: 2
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { readFile } from 'node:fs/promises';
          const html = await readFile('index.html', 'utf8');
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext();
          await context.addInitScript(() => {
            const values = new Map();
            Object.defineProperty(window, 'localStorage', { configurable:true, value:{
              getItem:key=>values.has(String(key))?values.get(String(key)):null,
              setItem:(key,value)=>values.set(String(key),String(value)),
              removeItem:key=>values.delete(String(key)),
              clear:()=>values.clear(),
              key:index=>Array.from(values.keys())[index]??null,
              get length(){return values.size;}
            }});
          });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push('PAGE: '+e.stack));
          page.on('console', m => { if(m.type()==='error') errors.push('CONSOLE: '+m.text()); });
          await page.route('https://**/*', route => route.abort());
          await page.setContent(html, {waitUntil:'domcontentloaded',timeout:10000});
          await page.waitForTimeout(500);
          const result = await page.evaluate(() => ({
            title: document.title,
            bodyText: document.body.innerText.slice(0,700),
            homeVisible: !!document.querySelector('#home.page.active'),
            itineraryCount: document.querySelectorAll('#itineraryLocations .location-accordion').length,
            foodTools: !!document.getElementById('foodSearch'),
            debug: document.getElementById('app-debug')?.innerText || ''
          }));
          console.log(JSON.stringify({result,errors},null,2));
          if(errors.some(e=>e.startsWith('PAGE:')) || !result.homeVisible || !result.foodTools || result.itineraryCount===0) process.exitCode=1;
          await browser.close();
          JS

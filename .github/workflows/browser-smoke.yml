name: Japan app browser smoke test
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run app and capture startup errors
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push('PAGE: '+e.stack));
          page.on('console', m => { if(m.type()==='error') errors.push('CONSOLE: '+m.text()); });
          const response = await page.goto('http://127.0.0.1:8000/index.html', {waitUntil:'commit',timeout:10000});
          await page.waitForLoadState('domcontentloaded',{timeout:10000}).catch(()=>{});
          await page.waitForTimeout(1500);
          const result = await page.evaluate(() => ({
            title: document.title,
            bodyText: document.body.innerText.slice(0,700),
            homeVisible: !!document.querySelector('#home.page.active'),
            itineraryCount: document.querySelectorAll('#itineraryLocations .location-accordion').length,
            foodTools: !!document.getElementById('foodSearch'),
            debug: document.getElementById('app-debug')?.innerText || ''
          }));
          console.log(JSON.stringify({httpStatus:response?.status(),result,errors},null,2));
          if(!response?.ok() || errors.some(e=>e.startsWith('PAGE:')) || !result.homeVisible || !result.foodTools) process.exitCode=1;
          await browser.close();
          JS

name: Japan app browser smoke test
on:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run app and capture startup errors
        timeout-minutes: 2
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { readFile } from 'node:fs/promises';
          import { createServer } from 'node:http';
          const html = await readFile('index.html', 'utf8');
          const appJs = await readFile('app.js', 'utf8');
          const server = createServer((req,res) => {
            if (req.url === '/app.js') {
              res.writeHead(200, {'content-type':'text/javascript; charset=utf-8'});
              res.end(appJs);
              return;
            }
            if (req.url !== '/') {
              res.writeHead(404, {'content-type':'text/plain; charset=utf-8'});
              res.end('Not found');
              return;
            }
            res.writeHead(200, {'content-type':'text/html; charset=utf-8'});
            res.end(html);
          });
          await new Promise(resolve => server.listen(0,'127.0.0.1',resolve));
          const address = server.address();
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext();
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push('PAGE: '+e.stack));
          page.on('console', m => { if(m.type()==='error') errors.push('CONSOLE: '+m.text()); });
          await page.route('https://**/*', route => route.abort());
          const response = await page.goto('http://127.0.0.1:'+address.port+'/', {waitUntil:'commit',timeout:10000});
          await page.waitForLoadState('domcontentloaded',{timeout:5000}).catch(()=>{});
          await page.waitForTimeout(500);
          const result = await page.evaluate(() => ({
            title: document.title,
            bodyText: document.body.innerText.slice(0,700),
            homeVisible: !!document.querySelector('#home.page.active'),
            itineraryCount: document.querySelectorAll('#itineraryLocations .location-accordion').length,
            foodTools: !!document.getElementById('foodSearch'),
            debug: document.getElementById('app-debug')?.innerText || '',
            storageAvailable: (() => {try {localStorage.setItem('__test','1');localStorage.removeItem('__test');return true;} catch(e){return false;}})()
          }));
          console.log(JSON.stringify({httpStatus:response?.status(),result,errors},null,2));
          if(!response?.ok() || errors.some(e=>e.startsWith('PAGE:')) || !result.homeVisible || !result.foodTools || result.itineraryCount===0 || !result.storageAvailable) process.exitCode=1;
          await browser.close();
          await new Promise(resolve=>server.close(resolve));
          JS
